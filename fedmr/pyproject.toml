[project]
name = "flamingo-fedmr"
version = "0.1.0"
description = "FedMR: exact federated one-sample Mendelian randomization from summed sufficient statistics"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flamingo_fedmr"]
