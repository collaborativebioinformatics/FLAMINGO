<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FLAMINGO</title><style>html,body{margin:0;width:100%;height:100%;background:#19161d;overflow:hidden}img{width:100vw;height:100vh;object-fit:contain}button{position:fixed;bottom:12px;background:#26212c;color:#fff5f8;border:1px solid #49384d;border-radius:8px;padding:7px 12px;cursor:pointer;opacity:.3}button:hover,button:focus{opacity:1}#prev{left:12px}#next{right:12px}</style><img id="slide" src="assets/slide-1.svg" alt="Slide 1: project aim"><button id="prev" aria-label="Previous slide">←</button><button id="next" aria-label="Next slide">→</button><script>let n=1;const names=['project aim','methods','results','dashboard'];function go(d){n=Math.max(1,Math.min(4,n+d));slide.src='assets/slide-'+n+'.svg';slide.alt='Slide '+n+': '+names[n-1];location.hash=n;}prev.onclick=()=>go(-1);next.onclick=()=>go(1);onkeydown=e=>{if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();go(1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(-1)}if(e.key==='f')document.documentElement.requestFullscreen();};if(+location.hash.slice(1)>=1&&+location.hash.slice(1)<=4){n=+location.hash.slice(1);go(0)}</script></html>
